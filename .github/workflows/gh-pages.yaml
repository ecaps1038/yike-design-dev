name: Website

on:
  push:
    branches:
      - monorepo-dev
  workflow_dispatch:

concurrency:
  group: gh-pages
  cancel-in-progress: true

# 允许使用仓库自带的 GITHUB_TOKEN 推送 gh-pages 分支
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generations of Components
        run: pnpm run build:comp

      - name: Build docs
        run: |
          pnpm run build:demo
          cp ./packages/yike-design-demo/dist/index.html ./packages/yike-design-demo/dist/404.html

      - name: Deploy site
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: true
          branch: gh-pages
          folder: ./packages/yike-design-demo/dist
